<!doctype html>
<html lang="en">
  <head>
    <script>
      (function() {
        // 1. Intercept and silence all Vite/HMR websocket logs and errors
        var origError = console.error;
        var origWarn = console.warn;
        var origInfo = console.info;
        var origDebug = console.debug;

        function isViteNoise(args) {
          if (!args || !args.length) return false;
          for (var i = 0; i < args.length; i++) {
            var val = args[i];
            var str = String(val && val.message ? val.message : (val || '')).toLowerCase();
            if (
              str.indexOf('websocket') !== -1 ||
              str.indexOf('[vite]') !== -1 ||
              str.indexOf('vite-hmr') !== -1 ||
              str.indexOf('closed without opened') !== -1
            ) {
              return true;
            }
          }
          return false;
        }

        console.error = function() {
          if (isViteNoise(arguments)) return;
          return origError.apply(console, arguments);
        };
        console.warn = function() {
          if (isViteNoise(arguments)) return;
          return origWarn.apply(console, arguments);
        };
        console.info = function() {
          if (isViteNoise(arguments)) return;
          return origInfo.apply(console, arguments);
        };
        console.debug = function() {
          if (isViteNoise(arguments)) return;
          return origDebug.apply(console, arguments);
        };

        window.addEventListener('error', function(e) {
          var msg = (e && (e.message || (e.error && e.error.message))) || '';
          if (typeof msg === 'string' && (msg.indexOf('WebSocket') !== -1 || msg.indexOf('vite') !== -1)) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var reason = (e && e.reason && (e.reason.message || e.reason)) || '';
          if (typeof reason === 'string' && (reason.indexOf('WebSocket') !== -1 || reason.indexOf('vite') !== -1)) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);

        // 2. Mock WebSocket for Vite HMR so Vite's connection succeeds immediately without closing
        if (typeof window !== 'undefined' && window.WebSocket) {
          var RealWebSocket = window.WebSocket;
          var MockWebSocket = function(url, protocols) {
            var isViteReq = false;
            if (
              protocols === 'vite-hmr' ||
              protocols === 'vite-ping' ||
              (typeof url === 'string' && (url.indexOf('token=') !== -1 || url.indexOf('vite') !== -1))
            ) {
              isViteReq = true;
            }

            if (!isViteReq) {
              return new RealWebSocket(url, protocols);
            }

            var listeners = {};
            var self = {
              readyState: 1, // OPEN
              OPEN: 1,
              CLOSED: 3,
              CLOSING: 2,
              CONNECTING: 0,
              url: url,
              protocol: protocols || '',
              bufferedAmount: 0,
              extensions: '',
              binaryType: 'blob',
              onopen: null,
              onclose: null,
              onmessage: null,
              onerror: null,
              addEventListener: function(event, callback) {
                if (!listeners[event]) listeners[event] = [];
                listeners[event].push(callback);
                if (event === 'open') {
                  setTimeout(function() {
                    try { callback({ type: 'open' }); } catch(err) {}
                  }, 0);
                }
              },
              removeEventListener: function(event, callback) {
                if (listeners[event]) {
                  listeners[event] = listeners[event].filter(function(cb) { return cb !== callback; });
                }
              },
              dispatchEvent: function() { return true; },
              send: function() {},
              close: function() {
                self.readyState = 3;
                if (listeners['close']) {
                  listeners['close'].forEach(function(cb) {
                    try { cb({ type: 'close', wasClean: true, code: 1000 }); } catch(err) {}
                  });
                }
              }
            };

            setTimeout(function() {
              if (typeof self.onopen === 'function') {
                try { self.onopen({ type: 'open' }); } catch(err) {}
              }
            }, 0);

            return self;
          };

          MockWebSocket.prototype = RealWebSocket.prototype;
          MockWebSocket.OPEN = RealWebSocket.OPEN;
          MockWebSocket.CLOSED = RealWebSocket.CLOSED;
          MockWebSocket.CLOSING = RealWebSocket.CLOSING;
          MockWebSocket.CONNECTING = RealWebSocket.CONNECTING;
          window.WebSocket = MockWebSocket;
        }
      })();
    </script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
